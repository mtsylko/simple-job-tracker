name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # The API's tests create their own databases on this server.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: yarn install --immutable --mode=skip-build

      - name: API
        run: |
          yarn workspace job-tracker-api build
          yarn workspace job-tracker-api lint
          yarn workspace job-tracker-api test

      - name: Web
        run: |
          yarn workspace web-front lint
          yarn workspace web-front build

  e2e:
    runs-on: ubuntu-latest
    # The suite creates its own database on this server.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: yarn install --immutable --mode=skip-build

      - name: Lint
        run: |
          yarn workspace job-tracker-e2e lint
          yarn workspace job-tracker-e2e compile

      - run: yarn workspace job-tracker-e2e playwright install --with-deps chromium

      - run: yarn workspace job-tracker-e2e test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
